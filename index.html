<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#382a5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="귀여운 손님과 리어카부터 궁전까지 키우는 붕어빵 장사 게임"><title>붕어빵 타이쿤 · 작은 노점</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon.png"><link rel="icon" href="assets/props/2.png"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
 <header><div class="brand"><img src="assets/props/2.png" alt=""><div><small>돌아온 그때 그 맛</small><h1>붕어빵 타이쿤<span>3</span></h1></div></div><button id="menu" class="icon-button" aria-label="메뉴 열기">☰</button></header>
 <section class="hud" aria-label="장사 현황"><div><span id="day-label">1일째</span><strong id="coins">0<span>원</span></strong></div><div class="timer-box"><span>오늘의 장사 <b id="time">2:00</b></span><div class="time-track"><i id="time-fill"></i></div></div><button id="pause" class="icon-button" aria-label="일시정지">Ⅱ</button></section>
 <section class="street" aria-label="손님 주문"><div class="stall-building" aria-hidden="true"><div class="stall-roof"></div><div class="stall-window left"></div><div class="stall-window right"></div><div class="stall-door"></div><div class="stall-counter"></div><div class="wheel left"></div><div class="wheel right"></div><div class="cart-handle"></div><div class="stall-crown">♛</div></div><div class="street-sign">갓 구운 행복, 한 봉지!</div><div id="customers"></div><div class="awning"></div></section>
 <section class="counter"><div><img src="assets/props/1.png" alt=""><span>구운 붕어빵 <b id="stock">0</b><small>개</small></span></div><span id="combo">따끈따끈!</span></section>
 <section class="grill-shell"><div class="grill-caption"><span>반죽 → 뒤집기 → 꺼내기 · 손님을 눌러 판매</span><i id="heat-led"></i></div><div id="molds" aria-label="붕어빵 굽기판"></div><div class="grill-bottom"><span>● BUNGEOPPANG</span><span>손끝으로 굽는 작은 행복</span></div></section>
 <div class="notice" id="notice" role="status">빈 빵틀을 톡! 장사를 시작해요.</div>
 <section class="controls"><button id="pump"><img src="assets/props/0.png" alt=""><span>불 올리기<small id="heat-label">펌프로 더 빠르게</small></span></button><button id="shop"><img src="assets/props/3.png" alt=""><span><span id="shop-label">가게 확장</span><small id="shop-next">리어카 → 지붕 리어카</small></span></button></section>
 <footer><span id="save-state">기기에 자동 저장</span><span>작은 노점 · v2.3.0</span></footer>
 <div id="overlay" class="overlay"><section class="card" id="card"></section></div>
</main><script type="module" src="app.mjs"></script></body></html>
